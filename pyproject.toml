[project]
name = "xiutu"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn>=0.30,<1",
 "pydantic>=2,<3",
 "pydantic-settings>=2,<3",
 "sqlalchemy>=2,<3",
 "psycopg[binary,pool]>=3.2,<4",
 "alembic>=1.13,<2",
 "pgvector>=0.3,<1",
 "langchain-deepseek>=0.1,<2",
 "langgraph>=1,<2",
 "langgraph-checkpoint-postgres>=3,<4",
 "mcp==1.30.0",
 "httpx==0.28.1",
 "pypdf>=6,<7",
 "markdown-it-py>=4,<5",
 "python-multipart>=0.0.20,<1",
 "tiktoken>=0.11,<1",
 "onnxruntime>=1.20,<2",
 "tokenizers>=0.21,<1",
 "numpy>=2,<3",
 "langchain-core==1.6.3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/contract", "tests/probes"]
addopts = "--strict-markers"
markers = ["database: requires isolated real PostgreSQL", "live: paid model, never enabled by default"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
