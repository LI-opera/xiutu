<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <style>.h{font:700 27px 'Microsoft YaHei';fill:#11392f}.t{font:18px 'Microsoft YaHei';fill:#365b53}.n{fill:#edf7f3;stroke:#17785e;stroke-width:3}.q{fill:#fff4d8;stroke:#c58518;stroke-width:3}.x{fill:#fff0ed;stroke:#b44e43;stroke-width:3}.a{stroke:#247c66;stroke-width:4;fill:none;marker-end:url(#m)}.l{font:17px 'Microsoft YaHei';fill:#47665f}</style>
