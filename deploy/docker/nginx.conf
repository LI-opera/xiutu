server {
    listen 80;
    root /usr/share/nginx/html;

    # Manual uploads are Markdown text (the API limits their size).
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # An AI analysis waits for the model inside the request.
        proxy_read_timeout 300s;
    }

    # Page routes (/workbench, /history, /documents) are handled by the frontend.
    location / {
        try_files $uri /index.html;
    }
}
