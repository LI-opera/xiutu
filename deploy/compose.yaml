name: xiutu-v5
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: xiutu
      POSTGRES_PASSWORD: ${XIUTU_DB_PASSWORD:?Supply a local isolated database password}
      POSTGRES_DB: xiutu_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wp01_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiutu -d xiutu_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  wp01_pgdata:
